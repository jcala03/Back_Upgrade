    steps:
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 212.85.29.152
          username: u497825029
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          command_timeout: 10m
          script: |
